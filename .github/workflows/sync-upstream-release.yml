name: Sync Upstream Release and Notify

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check and sync latest upstream release tag
        id: sync_check
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/charmbracelet/crush.git 2>/dev/null || git remote set-url upstream https://github.com/charmbracelet/crush.git
          git fetch upstream --tags --force
          git fetch origin upstream-stable || true

          latest_tag="$(git ls-remote --tags --refs upstream 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No upstream release tag found."
            echo "has_new_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_sha="$(git rev-list -n 1 "refs/tags/$latest_tag")"
          current_tag=""
          if git rev-parse --verify origin/upstream-stable >/dev/null 2>&1; then
            current_tag="$(git show origin/upstream-stable:.agent-builder-upstream-release 2>/dev/null || true)"
          fi

          echo "Latest upstream release: $latest_tag ($latest_sha)"
          echo "Current upstream-stable release marker: ${current_tag:-none}"

          if [ "$current_tag" = "$latest_tag" ]; then
            echo "has_new_update=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release."
            exit 0
          fi

          git checkout -B upstream-stable "$latest_tag"
          rm -rf .github/workflows
          printf "%s\n" "$latest_tag" > .agent-builder-upstream-release
          git add -A .github/workflows
          git add .agent-builder-upstream-release
          git commit --allow-empty -m "chore: sync upstream $latest_tag without workflows"
          sanitized_sha="$(git rev-parse HEAD)"
          git push origin upstream-stable --force

          echo "has_new_update=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "latest_sha=$latest_sha" >> "$GITHUB_OUTPUT"
          echo "sanitized_sha=$sanitized_sha" >> "$GITHUB_OUTPUT"

      - name: Send webhook notification
        if: steps.sync_check.outputs.has_new_update == 'true' && env.FEISHU_WEBHOOK_URL != ''
        shell: bash
        env:
          LATEST_TAG: ${{ steps.sync_check.outputs.latest_tag }}
          LATEST_SHA: ${{ steps.sync_check.outputs.latest_sha }}
          SANITIZED_SHA: ${{ steps.sync_check.outputs.sanitized_sha }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg tag "$LATEST_TAG" \
            --arg sha "$LATEST_SHA" \
            '{
              msg_type: "text",
              content: {
                text: ("GitHub 自动化提醒：\nCrush upstream 发布了新稳定版 " + $tag + "。\n已同步到本仓库 upstream-stable 分支。\nUpstream commit: " + $sha + "\n注意：同步分支已剔除 upstream 的 .github/workflows，避免 GitHub App workflow 权限限制。\n下一步可以让 AI 分析 upstream-stable 与 main 的差异，筛选需要合并的修复和能力。")
              }
            }')"

          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$FEISHU_WEBHOOK_URL"
