<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Agent Builder AB logo concept</title>
  <defs>
    <linearGradient id="surface" x1="144" y1="96" x2="880" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <filter id="shadow" x="92" y="72" width="840" height="888" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#111111" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#F7F7F2"/>
  <g filter="url(#shadow)">
    <rect x="144" y="104" width="736" height="816" rx="168" fill="url(#surface)" stroke="#161616" stroke-width="14"/>
  </g>

  <text
    x="512"
    y="592"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#111111"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"
    font-size="342"
    font-weight="800"
    letter-spacing="-24"
  >AB</text>
</svg>
